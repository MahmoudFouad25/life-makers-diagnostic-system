<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأسئلة التفاعلية - نظام التشخيص</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
            min-height: 100vh;
            padding: 20px;
            color: #2d3748;
        }

        .top-bar {
            background: white;
            border-radius: 15px;
            padding: 20px 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .session-info {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .session-id {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }

        .participant-name {
            color: #4a5568;
            font-weight: 600;
        }

        .top-actions {
            display: flex;
            gap: 10px;
        }

        .top-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .review-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .review-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(240, 147, 251, 0.4);
        }

        .back-home {
            background: #e2e8f0;
            color: #4a5568;
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .back-home:hover {
            background: #cbd5e0;
        }

        .progress-container {
            background: white;
            border-radius: 15px;
            padding: 25px 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .progress-title {
            font-size: 16px;
            font-weight: 600;
            color: #2d3748;
        }

        .progress-stats {
            font-size: 14px;
            color: #718096;
        }

        .progress-bar-bg {
            height: 12px;
            background: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            transition: width 0.5s ease;
            position: relative;
        }

        .progress-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .main-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .question-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            animation: slideIn 0.5s ease;
            position: relative;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .previous-answer-notice {
            background: #e0f2fe;
            border: 2px solid #0284c7;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #075985;
            font-size: 14px;
            font-weight: 600;
        }

        .topic-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .question-type {
            font-size: 12px;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .question-text {
            font-size: 22px;
            color: #2d3748;
            line-height: 1.6;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .question-number {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .input-group {
            margin-bottom: 25px;
        }

        .choice-button {
            display: block;
            width: 100%;
            padding: 18px 25px;
            margin-bottom: 12px;
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #4a5568;
            cursor: pointer;
            transition: all 0.3s;
            text-align: right;
        }

        .choice-button:hover {
            background: #edf2f7;
            border-color: #cbd5e0;
            transform: translateX(-5px);
        }

        .choice-button.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .text-input, .textarea-input, .number-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            color: #2d3748;
            transition: all 0.3s;
        }

        .text-input:focus, .textarea-input:focus, .number-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .textarea-input {
            min-height: 120px;
            resize: vertical;
        }

        .scale-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }

        .scale-button {
            flex: 1;
            padding: 15px 10px;
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            color: #4a5568;
            cursor: pointer;
            transition: all 0.3s;
        }

        .scale-button:hover {
            background: #edf2f7;
            transform: scale(1.05);
        }

        .scale-button.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .scale-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 13px;
            color: #718096;
        }

        .follow-up-card {
            background: #fffbeb;
            border: 2px solid #fbbf24;
            border-radius: 15px;
            padding: 20px;
            margin-top: 25px;
            animation: slideIn 0.5s ease;
        }

        .follow-up-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #92400e;
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .follow-up-text {
            color: #78350f;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 150px;
            padding: 16px 30px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-prev {
            background: #f7fafc;
            color: #4a5568;
            border: 2px solid #e2e8f0;
        }

        .btn-prev:hover:not(:disabled) {
            background: #edf2f7;
            border-color: #cbd5e0;
        }

        .btn-prev:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-next {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-next:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-skip {
            background: white;
            color: #718096;
            border: 2px solid #e2e8f0;
        }

        .btn-skip:hover {
            background: #f7fafc;
            border-color: #cbd5e0;
        }

        .completion-card {
            text-align: center;
            padding: 60px 40px;
        }

        .completion-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .completion-title {
            font-size: 32px;
            color: #2d3748;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .completion-message {
            font-size: 18px;
            color: #718096;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .skipped-questions-section {
            background: #fef3c7;
            border: 2px solid #f59e0b;
            border-radius: 15px;
            padding: 25px;
            margin: 30px 0;
            text-align: right;
        }

        .skipped-title {
            font-size: 20px;
            color: #92400e;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .skipped-list {
            list-style: none;
            padding: 0;
        }

        .skipped-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s;
            color: #4a5568;
        }

        .skipped-item:hover {
            background: #fef3c7;
            transform: translateX(-5px);
        }

        .completion-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 14px;
            color: #718096;
            margin-top: 5px;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #e2e8f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: #fee;
            border: 2px solid #fcc;
            color: #c33;
            padding: 15px 20px;
            border-radius: 10px;
            margin-top: 20px;
            font-weight: 600;
        }

        /* Review Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 40px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
        }

        .modal-title {
            font-size: 24px;
            color: #2d3748;
            font-weight: 700;
        }

        .modal-close {
            width: 40px;
            height: 40px;
            border: none;
            background: #f7fafc;
            color: #4a5568;
            border-radius: 10px;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: #e2e8f0;
        }

        .review-section {
            margin-bottom: 30px;
        }

        .review-axis-title {
            font-size: 20px;
            color: #2d3748;
            font-weight: 700;
            margin-bottom: 15px;
            padding: 12px;
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            border-radius: 10px;
        }

        .review-topic {
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
        }

        .review-topic-title {
            font-size: 16px;
            font-weight: 700;
            color: #4a5568;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .review-question-item {
            background: #f7fafc;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .review-question-item:hover {
            background: #edf2f7;
            transform: translateX(-5px);
        }

        .review-question-item.unanswered {
            background: #fef3c7;
            border: 2px solid #f59e0b;
        }

        .review-q-text {
            font-size: 14px;
            color: #4a5568;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .review-answer {
            font-size: 14px;
            color: #667eea;
            font-weight: 600;
        }

        .review-unanswered {
            font-size: 14px;
            color: #f59e0b;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .question-card {
                padding: 30px 20px;
            }
            
            .question-text {
                font-size: 18px;
            }

            .scale-container {
                flex-wrap: wrap;
            }

            .scale-button {
                min-width: 60px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .modal-content {
                padding: 20px;
            }
        }

        .hidden {
            display: none !important;
        }

        /* Custom Confirmation Modal */
        .confirm-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .confirm-box {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .confirm-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .confirm-title {
            font-size: 24px;
            color: #2d3748;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .confirm-message {
            font-size: 16px;
            color: #4a5568;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .confirm-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .confirm-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .confirm-btn-yes {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .confirm-btn-yes:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .confirm-btn-no {
            background: #f7fafc;
            color: #4a5568;
            border: 2px solid #e2e8f0;
        }

        .confirm-btn-no:hover {
            background: #edf2f7;
        }
        
    </style>
</head>
<body>
    <!-- شريط المعلومات العلوي -->
    <div class="top-bar">
        <div class="session-info">
            <div class="session-id" id="sessionId" style="font-size: 16px;">...</div>
            <div class="participant-name">
                <span id="participantName">مشارك</span>
            </div>
        </div>
        <div class="top-actions">
            <button class="top-btn review-btn" onclick="openReviewModal()">
                📋 عرض كل الإجابات
            </button>
            <a href="index.html" class="back-home">↩️ الصفحة الرئيسية</a>
        </div>
    </div>

    <!-- شريط التقدم -->
    <div class="progress-container">
        <div class="progress-header">
            <div class="progress-title">التقدم في التشخيص</div>
            <div class="progress-stats">
                <span id="progressText">0 من 0 سؤال</span>
            </div>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar" style="width: 0%"></div>
        </div>
    </div>

    <!-- الحاوية الرئيسية -->
    <div class="main-container">
        <!-- بطاقة السؤال -->
        <div class="question-card" id="questionCard">
            <div class="question-number" id="questionNumber">1</div>
            
            <div id="previousAnswerNotice" class="previous-answer-notice hidden">
                💡 أنت جاوبت على هذا السؤال من قبل - يمكنك تعديل الإجابة
            </div>

            <div class="topic-badge" id="topicBadge">
                <span id="topicIcon">🏢</span>
                <span id="topicTitle">الهيكل التنظيمي</span>
            </div>

            <div class="question-type" id="questionType">سؤال افتتاحي</div>
            
            <div class="question-text" id="questionText">
                جاري التحميل...
            </div>

            <!-- منطقة الإجابة -->
            <div id="answerArea"></div>

            <!-- بطاقة السؤال التكميلي -->
            <div id="followUpContainer" class="hidden"></div>

            <!-- رسالة خطأ -->
            <div id="errorMessage" class="hidden error-message"></div>

            <!-- أزرار التحكم -->
            <div class="action-buttons">
                <button class="btn btn-prev" id="prevBtn" disabled>
                    ⬅️ السابق
                </button>
                <button class="btn btn-skip" id="skipBtn">
                    ⏭️ تخطي
                </button>
                <button class="btn btn-next" id="nextBtn">
                    التالي ➡️
                </button>
            </div>
        </div>
    </div>

    <!-- Review Modal -->
    <div id="reviewModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">📋 مراجعة جميع الإجابات</h2>
                <button class="modal-close" onclick="closeReviewModal()">×</button>
            </div>
            <div id="reviewContent"></div>
        </div>
    </div>

    <!-- شاشة التحميل -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loading-content">
            <div class="spinner"></div>
            <div style="color: #2d3748; font-weight: 600; font-size: 18px;">
                جاري حفظ الإجابات...
            </div>
        </div>
    </div>

    <!-- Firebase و Logic -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, doc, setDoc, query, where, getDocs, updateDoc, getDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { questionsData } from './questions-data.js';
// Custom Confirmation Dialog
        function showConfirm(icon, title, message) {
            return new Promise((resolve) => {
                const modal = document.getElementById('confirmModal');
                document.getElementById('confirmIcon').textContent = icon;
                document.getElementById('confirmTitle').textContent = title;
                document.getElementById('confirmMessage').textContent = message;
                
                modal.classList.remove('hidden');
                
                document.getElementById('confirmYes').onclick = () => {
                    modal.classList.add('hidden');
                    resolve(true);
                };
                
                document.getElementById('confirmNo').onclick = () => {
                    modal.classList.add('hidden');
                    resolve(false);
                };
            });
        }
        
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDZvB9jIzd5ponaiudD61PiL8tfajEHx2A",
            authDomain: "life-makers-diagnostic.firebaseapp.com",
            projectId: "life-makers-diagnostic",
            storageBucket: "life-makers-diagnostic.firebasestorage.app",
            messagingSenderId: "819336926740",
            appId: "1:819336926740:web:d338b3299e6d18e3b67901",
            measurementId: "G-4Z1FWWKG1C"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // State Management
        let organizationName = getOrganizationName();
        let sessionId = getOrCreateSessionId();
        let participantName = getParticipantName();
        let currentAxis = 'system';
        let currentTopicIndex = 0;
        let currentQuestionIndex = 0;
        let allAnswers = {};
        let totalQuestionsCount = 0;
        let answeredQuestionsCount = 0;
        let allQuestionsList = [];
        let currentAbsoluteIndex = 0;

        // Initialize
        if (organizationName) {
            document.getElementById('sessionId').textContent = organizationName;
            document.getElementById('participantName').textContent = participantName;

            // تأكد من وجود org في URL
            if (!window.location.search.includes('org=')) {
                const newUrl = window.location.pathname + '?org=' + encodeURIComponent(organizationName);
                window.history.replaceState({}, '', newUrl);
            }

            // Build questions list and calculate total
            buildQuestionsList();
            
            // Try to resume session
            resumeSession();
        }

        function getOrganizationName() {
            const urlParams = new URLSearchParams(window.location.search);
            const orgFromUrl = urlParams.get('org');
            
            if (orgFromUrl) {
                const orgName = decodeURIComponent(orgFromUrl);
                localStorage.setItem('currentOrganization', orgName);
                return orgName;
            }
            
            const orgFromStorage = localStorage.getItem('currentOrganization');
            if (orgFromStorage) {
                return orgFromStorage;
            }
            
            alert('⚠️ هذا الرابط غير صحيح. من فضلك استخدم الرابط المُرسل من الأدمن.');
            window.location.href = 'index.html';
            return null;
        }

        function getOrCreateSessionId() {
            if (!organizationName) return null;
            
            // Session ID = Organization Name (ثابت لكل جمعية)
            // هذا يضمن أن كل من يفتح الرابط يرى نفس البيانات
            return 'ORG-' + organizationName.replace(/[^a-zA-Z0-9\u0600-\u06FF]/g, '_');
        }

        function getParticipantName() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('name') || 'مشارك';
        }

        function buildQuestionsList() {
            allQuestionsList = [];
            let index = 0;
            
            Object.keys(questionsData).forEach(axisKey => {
                const axisData = questionsData[axisKey];
                Object.keys(axisData.topics).forEach(topicKey => {
                    const topicData = axisData.topics[topicKey];
                    topicData.questions.forEach(question => {
                        allQuestionsList.push({
                            index: index++,
                            axisKey: axisKey,
                            topicKey: topicKey,
                            question: question,
                            axisData: axisData,
                            topicData: topicData
                        });
                    });
                });
            });
            
            totalQuestionsCount = allQuestionsList.length;
            document.getElementById('progressText').textContent = `0 من ${totalQuestionsCount} سؤال`;
        }

        async function resumeSession() {
            try {
                // Document ID = Organization Name
                const docId = organizationName.replace(/[^a-zA-Z0-9\u0600-\u06FF]/g, '_');
                const docRef = doc(db, 'responses', docId);
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    sessionId = data.sessionId || sessionId;
                    allAnswers = data.answers || {};
                    
                    // Count answered questions
                    answeredQuestionsCount = 0;
                    let lastAnsweredIndex = -1;
                    
                    allQuestionsList.forEach((item, idx) => {
                        const answer = getAnswer(item.axisKey, item.topicKey, item.question.id);
                        if (answer) {
                            answeredQuestionsCount++;
                            lastAnsweredIndex = idx;
                        }
                    });
                    
                    // Resume from last answered + 1
                    if (lastAnsweredIndex >= 0 && lastAnsweredIndex < allQuestionsList.length - 1) {
                        currentAbsoluteIndex = lastAnsweredIndex + 1;
                    } else if (lastAnsweredIndex === allQuestionsList.length - 1) {
                        currentAbsoluteIndex = 0;
                    } else {
                        currentAbsoluteIndex = 0;
                    }
                    
                    updateProgress();
                    loadQuestionByIndex(currentAbsoluteIndex);
                    console.log('Session resumed successfully');
                    return;
                }
                
                // No existing session - create new one
                await initializeSession();
                loadQuestionByIndex(0);
                
            } catch (error) {
                console.error('Error resuming session:', error);
                loadQuestionByIndex(0);
            }
        }

        async function initializeSession() {
            try {
                // Document ID = Organization Name (readable)
                const docId = organizationName.replace(/[^a-zA-Z0-9\u0600-\u06FF]/g, '_');
                const docRef = doc(db, 'responses', docId);
                
                // Check if document exists
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    console.log('Session already exists for this organization');
                    return;
                }
                
                // Create new document with organization name as ID
                await setDoc(docRef, {
                    organizationName: organizationName,
                    sessionId: sessionId,
                    participantName: participantName,
                    answers: {},
                    progress: {
                        answered: 0,
                        total: totalQuestionsCount,
                        percentage: 0
                    },
                    isFinal: false,
                    timestamp: serverTimestamp(),
                    status: 'initialized'
                });
                
                console.log('New session initialized with ID:', docId);
            } catch (error) {
                console.error('Error initializing session:', error);
            }
        }

        function loadQuestionByIndex(index) {
            if (index < 0 || index >= allQuestionsList.length) {
                showCompletion();
                return;
            }
            
            currentAbsoluteIndex = index;
            const item = allQuestionsList[index];
            
            currentAxis = item.axisKey;
            const topicKeys = Object.keys(item.axisData.topics);
            currentTopicIndex = topicKeys.indexOf(item.topicKey);
            currentQuestionIndex = item.topicData.questions.indexOf(item.question);
            
            renderQuestion(item);
            updateNavigationButtons();
        }

       function renderQuestion(item) {
            const { question, axisData, topicData } = item;
            
            // Update UI
            document.getElementById('questionNumber').textContent = currentAbsoluteIndex + 1;
            
            const badge = document.getElementById('topicBadge');
            badge.style.backgroundColor = axisData.color + '20';
            badge.style.color = axisData.color;
            document.getElementById('topicIcon').textContent = topicData.icon;
            document.getElementById('topicTitle').textContent = topicData.title;
            
            document.getElementById('questionType').textContent = getQuestionTypeLabel(question.type);
            document.getElementById('questionText').textContent = question.text;
            
            // Check if previously answered
            const previousAnswer = getAnswer(item.axisKey, item.topicKey, question.id);
            const previousFollowUp = getAnswer(item.axisKey, item.topicKey, question.id + '_followup');
            
            if (previousAnswer) {
                document.getElementById('previousAnswerNotice').classList.remove('hidden');
            } else {
                document.getElementById('previousAnswerNotice').classList.add('hidden');
            }
            
            // CRITICAL: Hide follow-up initially for every question
            document.getElementById('followUpContainer').classList.add('hidden');
            document.getElementById('followUpContainer').innerHTML = '';
            
            // Render answer input with previous answer if exists
            renderAnswerInput(question, item, previousAnswer, previousFollowUp);
            
            // Update progress
            updateProgress();
            
            // Reset error
            document.getElementById('errorMessage').classList.add('hidden');
        }

        function getAnswer(axisKey, topicKey, questionId) {
            if (allAnswers[axisKey] && allAnswers[axisKey][topicKey] && allAnswers[axisKey][topicKey][questionId]) {
                return allAnswers[axisKey][topicKey][questionId].answer;
            }
            return null;
        }

            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            // Previous button
            prevBtn.disabled = currentAbsoluteIndex === 0;
            
            // Next button text
            if (currentAbsoluteIndex === allQuestionsList.length - 1) {
                nextBtn.innerHTML = 'إنهاء 🎉';
            } else {
                nextBtn.innerHTML = 'التالي ➡️';
            }
        }

        function renderAnswerInput(question, item, previousAnswer = null, previousFollowUp = null) {
            const answerArea = document.getElementById('answerArea');
            answerArea.innerHTML = '';
            
            // Store original answer for confirmation
            window.originalAnswer = previousAnswer;
            window.originalFollowUp = previousFollowUp;
            window.hasChanged = false;

            if (question.inputType === 'choice') {
                question.choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-button';
                    btn.textContent = choice;
                    if (previousAnswer === choice) {
                        btn.classList.add('selected');
                    }
                    btn.onclick = () => selectChoice(btn, choice, question);
                    answerArea.appendChild(btn);
                });
            } else if (question.inputType === 'scale') {
                const container = document.createElement('div');
                container.className = 'scale-container';
                
                for (let i = question.scale.min; i <= question.scale.max; i++) {
                    const btn = document.createElement('button');
                    btn.className = 'scale-button';
                    btn.textContent = i;
                    if (previousAnswer == i) {
                        btn.classList.add('selected');
                    }
                    btn.onclick = () => selectScale(container, i, question);
                    container.appendChild(btn);
                }
                
                answerArea.appendChild(container);
                
                if (question.scale.labels) {
                    const labels = document.createElement('div');
                    labels.className = 'scale-labels';
                    question.scale.labels.forEach(label => {
                        const span = document.createElement('span');
                        span.textContent = label;
                        labels.appendChild(span);
                    });
                    answerArea.appendChild(labels);
                }
            } else if (question.inputType === 'text') {
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'text-input';
                input.placeholder = question.placeholder || 'اكتب إجابتك هنا...';
                if (previousAnswer) {
                    input.value = previousAnswer;
                }
                input.oninput = () => checkTextInput(input, question);
                answerArea.appendChild(input);
            } else if (question.inputType === 'textarea') {
                const textarea = document.createElement('textarea');
                textarea.className = 'textarea-input';
                textarea.placeholder = question.placeholder || 'اكتب إجابتك بالتفصيل...';
                if (previousAnswer) {
                    textarea.value = previousAnswer;
                }
                textarea.oninput = () => checkTextInput(textarea, question);
                answerArea.appendChild(textarea);
            } else if (question.inputType === 'number') {
                const input = document.createElement('input');
                input.type = 'number';
                input.className = 'number-input';
                input.placeholder = question.placeholder || 'أدخل رقم...';
                if (previousAnswer) {
                    input.value = previousAnswer;
                }
                input.oninput = () => checkTextInput(input, question);
                answerArea.appendChild(input);
            }
            
            // CRITICAL: Load follow-up if previous answer exists
            if (previousAnswer) {
                checkFollowUp(question, previousAnswer, previousFollowUp);
            }
        }

        async function selectChoice(btn, choice, question) {
            // Check if changing from previous answer
            if (window.originalAnswer && window.originalAnswer !== choice) {
                const confirmed = await showConfirm(
                    '⚠️',
                    'تغيير الإجابة',
                    `هل تريد تغيير إجابتك من "${window.originalAnswer}" إلى "${choice}"؟`
                );
                if (!confirmed) {
                    return;
                }
                window.hasChanged = true;
            }
            
            document.querySelectorAll('.choice-button').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            storeAnswer(question.id, choice);
            checkFollowUp(question, choice);
        }

        async function selectScale(container, value, question) {
            if (window.originalAnswer && window.originalAnswer != value) {
                const confirmed = await showConfirm(
                    '⚠️',
                    'تغيير الإجابة',
                    `هل تريد تغيير إجابتك من "${window.originalAnswer}" إلى "${value}"؟`
                );
                if (!confirmed) {
                    return;
                }
                window.hasChanged = true;
            }
            
            container.querySelectorAll('.scale-button').forEach(b => b.classList.remove('selected'));
            container.children[value - question.scale.min].classList.add('selected');
            storeAnswer(question.id, value);
            checkFollowUp(question, value);
        }

        function checkTextInput(input, question) {
            const value = input.value.trim();
            if (value.length > 0) {
                // Mark as changed if different from original
                if (window.originalAnswer && window.originalAnswer !== value) {
                    window.hasChanged = true;
                }
                storeAnswer(question.id, value);
                checkFollowUp(question, value);
            } else {
                document.getElementById('followUpContainer').classList.add('hidden');
            }
        }

        function storeAnswer(questionId, answer) {
            if (!allAnswers[currentAxis]) allAnswers[currentAxis] = {};
            const item = allQuestionsList[currentAbsoluteIndex];
            if (!allAnswers[currentAxis][item.topicKey]) allAnswers[currentAxis][item.topicKey] = {};
            allAnswers[currentAxis][item.topicKey][questionId] = {
                answer: answer,
                timestamp: new Date().toISOString()
            };
        }

        function checkFollowUp(question, answer, existingFollowUp = null) {
            // If question doesn't have follow-up, hide it
            if (!question.followUp) {
                document.getElementById('followUpContainer').classList.add('hidden');
                document.getElementById('followUpContainer').innerHTML = '';
                return;
            }

            let shouldShow = false;
            
            if (question.followUp.condition === 'any') {
                shouldShow = true;
            } else if (question.followUp.condition.includes('|')) {
                const conditions = question.followUp.condition.split('|');
                shouldShow = conditions.some(cond => String(answer).includes(cond.trim()));
            } else if (question.followUp.condition.startsWith('>=')) {
                const threshold = parseInt(question.followUp.condition.substring(2));
                shouldShow = parseInt(answer) >= threshold;
            } else if (question.followUp.condition.startsWith('<=')) {
                const threshold = parseInt(question.followUp.condition.substring(2));
                shouldShow = parseInt(answer) <= threshold;
            }

            if (shouldShow) {
                showFollowUp(question.followUp.question, existingFollowUp);
            } else {
                document.getElementById('followUpContainer').classList.add('hidden');
                document.getElementById('followUpContainer').innerHTML = '';
            }
        }


       function showFollowUp(followUpQuestion, existingAnswer = null) {
            const container = document.getElementById('followUpContainer');
            const currentValue = existingAnswer || '';
            
            container.innerHTML = `
                <div class="follow-up-label">
                    <span>💭</span>
                    <span>سؤال تكميلي</span>
                </div>
                <div class="follow-up-text">${followUpQuestion}</div>
                <textarea class="textarea-input" id="followUpAnswer" placeholder="اكتب إجابتك...">${currentValue}</textarea>
            `;
            container.classList.remove('hidden');
            
            // Store original follow-up answer
            window.originalFollowUp = existingAnswer;
            
            document.getElementById('followUpAnswer').oninput = (e) => {
                const item = allQuestionsList[currentAbsoluteIndex];
                const newValue = e.target.value.trim();
                
                // Mark as changed if different from original
                if (window.originalFollowUp && window.originalFollowUp !== newValue) {
                    window.hasChanged = true;
                }
                
                if (newValue.length > 0) {
                    storeAnswer(item.question.id + '_followup', newValue);
                }
            };
        }

        function updateProgress() {
            // Recount answered questions
            answeredQuestionsCount = 0;
            allQuestionsList.forEach(item => {
                const answer = getAnswer(item.axisKey, item.topicKey, item.question.id);
                if (answer) {
                    answeredQuestionsCount++;
                }
            });
            
            const percentage = (answeredQuestionsCount / totalQuestionsCount) * 100;
            document.getElementById('progressBar').style.width = percentage + '%';
            document.getElementById('progressText').textContent = 
                `${answeredQuestionsCount} من ${totalQuestionsCount} سؤال`;
        }

        // Navigation handlers
       document.getElementById('prevBtn').onclick = async () => {
            if (window.hasChanged && window.originalAnswer) {
                const confirmed = await showConfirm(
                    '⚠️',
                    'تعديلات غير محفوظة',
                    'لديك تعديلات غير محفوظة. هل تريد المتابعة بدون حفظ؟'
                );
                if (!confirmed) {
                    return;
                }
            }
            
            window.hasChanged = false;
            window.originalAnswer = null;
            window.originalFollowUp = null;
            
            loadQuestionByIndex(currentAbsoluteIndex - 1);
        };



        document.getElementById('nextBtn').onclick = async () => {
            if (window.hasChanged && window.originalAnswer) {
                const confirmed = await showConfirm(
                    '✅',
                    'حفظ التعديلات',
                    'هل تريد حفظ التعديلات والانتقال للسؤال التالي؟'
                );
                if (!confirmed) {
                    return;
                }
            }
            
            await saveToFirebase(false);
            
            window.hasChanged = false;
            window.originalAnswer = null;
            window.originalFollowUp = null;
            
            if (currentAbsoluteIndex >= allQuestionsList.length - 1) {
                showCompletion();
            } else {
                loadQuestionByIndex(currentAbsoluteIndex + 1);
            }
        };

        document.getElementById('skipBtn').onclick = () => {
            // Just move to next without saving answer
            if (currentAbsoluteIndex >= allQuestionsList.length - 1) {
                showCompletion();
            } else {
                loadQuestionByIndex(currentAbsoluteIndex + 1);
            }
        };

        async function saveToFirebase(isFinal = false) {
            try {
                document.getElementById('loadingOverlay').classList.remove('hidden');
                
                // Document ID = Organization Name
                const docId = organizationName.replace(/[^a-zA-Z0-9\u0600-\u06FF]/g, '_');
                const docRef = doc(db, 'responses', docId);
                
                const sessionDoc = {
                    organizationName: organizationName,
                    sessionId: sessionId,
                    participantName: participantName,
                    answers: allAnswers,
                    progress: {
                        answered: answeredQuestionsCount,
                        total: totalQuestionsCount,
                        percentage: (answeredQuestionsCount / totalQuestionsCount) * 100
                    },
                    isFinal: isFinal,
                    lastUpdated: serverTimestamp()
                };
                
                // Check if document exists
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    await updateDoc(docRef, sessionDoc);
                } else {
                    sessionDoc.timestamp = serverTimestamp();
                    await setDoc(docRef, sessionDoc);
                }
                
                document.getElementById('loadingOverlay').classList.add('hidden');
                console.log('Saved to document:', docId);
            } catch (error) {
                console.error('Error saving to Firebase:', error);
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        }



        async function showCompletion() {
            // Check for skipped questions
            const skippedQuestions = [];
            allQuestionsList.forEach(item => {
                const answer = getAnswer(item.axisKey, item.topicKey, item.question.id);
                if (!answer) {
                    skippedQuestions.push(item);
                }
            });
            
            const card = document.getElementById('questionCard');
            
            if (skippedQuestions.length > 0) {
                // Show skipped questions
                let skippedHTML = '<ul class="skipped-list">';
                skippedQuestions.forEach(item => {
                    skippedHTML += `
                        <li class="skipped-item" onclick="goToQuestion(${item.index})">
                            ${item.topicData.icon} ${item.question.text.substring(0, 60)}...
                        </li>
                    `;
                });
                skippedHTML += '</ul>';
                
                card.innerHTML = `
                    <div class="completion-card">
                        <div class="completion-icon">⚠️</div>
                        <h1 class="completion-title">انتبه! هناك أسئلة متخطاة</h1>
                        <p class="completion-message">
                            لديك ${skippedQuestions.length} سؤال لم يتم الإجابة عليه.<br>
                            هل تريد إكمالها أم إنهاء التشخيص؟
                        </p>
                        
                        <div class="skipped-questions-section">
                            <div class="skipped-title">📝 الأسئلة المتخطاة (اضغط للإجابة):</div>
                            ${skippedHTML}
                        </div>
                        
                        <div style="display: flex; gap: 15px; justify-content: center; margin-top: 30px;">
                            <button class="btn btn-next" onclick="finishAnyway()">
                                إنهاء على أي حال 🎉
                            </button>
                        </div>
                    </div>
                `;
            } else {
                // All answered - finish
                await saveToFirebase(true);
                
                card.innerHTML = `
                    <div class="completion-card">
                        <div class="completion-icon">🎉</div>
                        <h1 class="completion-title">تم إكمال التشخيص بنجاح!</h1>
                        <p class="completion-message">
                            شكراً لمشاركتك القيّمة. تم حفظ جميع إجاباتك بنجاح.<br>
                            سيتم تحليل البيانات وإعداد التقرير التشخيصي قريباً.
                        </p>
                        <div class="completion-stats">
                            <div class="stat-item">
                                <div class="stat-number">${answeredQuestionsCount}</div>
                                <div class="stat-label">سؤال تم الإجابة عليه</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">${Object.keys(allAnswers).length}</div>
                                <div class="stat-label">محور مكتمل</div>
                            </div>
                        </div>
                        <div style="margin-top: 40px;">
                            <a href="index.html" class="btn btn-next">
                                العودة للصفحة الرئيسية
                            </a>
                        </div>
                    </div>
                `;
            }
        }

        window.goToQuestion = function(index) {
            loadQuestionByIndex(index);
        };

        window.finishAnyway = async function() {
            await saveToFirebase(true);
            
            const card = document.getElementById('questionCard');
            card.innerHTML = `
                <div class="completion-card">
                    <div class="completion-icon">🎉</div>
                    <h1 class="completion-title">تم حفظ التشخيص!</h1>
                    <p class="completion-message">
                        تم حفظ إجاباتك بنجاح. يمكنك العودة لاحقاً لإكمال الأسئلة المتخطاة.
                    </p>
                    <div class="completion-stats">
                        <div class="stat-item">
                            <div class="stat-number">${answeredQuestionsCount}</div>
                            <div class="stat-label">سؤال تم الإجابة عليه</div>
                        </div>
                    </div>
                    <div style="margin-top: 40px;">
                        <a href="index.html" class="btn btn-next">
                            العودة للصفحة الرئيسية
                        </a>
                    </div>
                </div>
            `;
        };

        // Review Modal
        window.openReviewModal = function() {
            const modal = document.getElementById('reviewModal');
            const content = document.getElementById('reviewContent');
            
            let html = '';
            
            Object.keys(questionsData).forEach(axisKey => {
                const axisData = questionsData[axisKey];
                html += `<div class="review-section">`;
                html += `<div class="review-axis-title">${axisData.title}</div>`;
                
                Object.keys(axisData.topics).forEach(topicKey => {
                    const topicData = axisData.topics[topicKey];
                    html += `<div class="review-topic">`;
                    html += `<div class="review-topic-title">${topicData.icon} ${topicData.title}</div>`;
                    
                    topicData.questions.forEach(question => {
                        const answer = getAnswer(axisKey, topicKey, question.id);
                        const questionItem = allQuestionsList.find(item => 
                            item.axisKey === axisKey && 
                            item.topicKey === topicKey && 
                            item.question.id === question.id
                        );
                        
                        const className = answer ? 'review-question-item' : 'review-question-item unanswered';
                        
                        html += `
                            <div class="${className}" onclick="goToQuestion(${questionItem.index})">
                                <div class="review-q-text">${question.text}</div>
                                ${answer ? 
                                    `<div class="review-answer">✅ ${answer}</div>` : 
                                    `<div class="review-unanswered">⚠️ لم يتم الإجابة</div>`
                                }
                            </div>
                        `;
                    });
                    
                    html += `</div>`;
                });
                
                html += `</div>`;
            });
            
            content.innerHTML = html;
            modal.classList.remove('hidden');
        };

        window.closeReviewModal = function() {
            document.getElementById('reviewModal').classList.add('hidden');
        };
    </script>

    <!-- Custom Confirmation Modal -->
    <div id="confirmModal" class="confirm-modal hidden">
        <div class="confirm-box">
            <div class="confirm-icon" id="confirmIcon">⚠️</div>
            <div class="confirm-title" id="confirmTitle">تأكيد</div>
            <div class="confirm-message" id="confirmMessage"></div>
            <div class="confirm-buttons">
                <button class="confirm-btn confirm-btn-no" id="confirmNo">لا</button>
                <button class="confirm-btn confirm-btn-yes" id="confirmYes">نعم</button>
            </div>
        </div>
    </div>

</body>
</html>
