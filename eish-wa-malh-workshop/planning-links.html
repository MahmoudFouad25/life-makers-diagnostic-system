<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔗 روابط المحافظات - عيش وملح</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #667eea;
            --primary-light: #7c8ff8;
            --success: #10b981;
            --warning: #f59e0b;
            --bg-dark: #0f0f1a;
            --bg-dark-2: #1a1a2e;
            --bg-dark-3: #252542;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --text-muted: #64748b;
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-success: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 30px;
        }

        .header-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .header-title {
            font-size: 42px;
            font-weight: 900;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header-subtitle {
            font-size: 20px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .session-info {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: var(--bg-dark-2);
            border: 2px solid var(--primary);
            border-radius: 12px;
            font-size: 14px;
        }

        .session-info span {
            color: var(--primary-light);
            font-weight: 700;
            font-family: monospace;
        }

        /* Stats */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 25px;
            background: var(--bg-dark-2);
            border-radius: 12px;
        }

        .stat-icon {
            font-size: 28px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 900;
            color: var(--primary-light);
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Gov Cards Grid */
        .gov-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .gov-card {
            background: var(--bg-dark-2);
            border: 2px solid var(--bg-dark-3);
            border-radius: 20px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .gov-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .gov-card.submitted {
            border-color: var(--success);
        }

        .gov-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--bg-dark-3);
        }

        .gov-name {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .gov-status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }

        .gov-status.in-progress {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .gov-status.submitted {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .gov-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .gov-info-item {
            padding: 12px 15px;
            background: var(--bg-dark);
            border-radius: 10px;
        }

        .gov-info-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .gov-info-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .gov-info-value.highlight {
            color: var(--primary-light);
        }

        .gov-link-section {
            background: var(--bg-dark);
            border-radius: 12px;
            padding: 15px;
        }

        .gov-link-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .gov-link-box {
            display: flex;
            gap: 10px;
        }

        .gov-link-input {
            flex: 1;
            padding: 12px 15px;
            background: var(--bg-dark-2);
            border: 2px solid var(--bg-dark-3);
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 12px;
            font-family: monospace;
            direction: ltr;
            text-align: left;
        }

        .gov-link-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-copy {
            padding: 12px 20px;
            background: var(--gradient-primary);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-copy:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-copy.copied {
            background: var(--gradient-success);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
        }

        .empty-icon {
            font-size: 100px;
            margin-bottom: 25px;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 15px;
        }

        .empty-subtext {
            font-size: 16px;
            color: var(--text-muted);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--gradient-success);
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 10px 40px rgba(16, 185, 129, 0.4);
            z-index: 9999;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--bg-dark-3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 18px;
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-title {
                font-size: 28px;
            }

            .gov-grid {
                grid-template-columns: 1fr;
            }

            .stats-bar {
                flex-direction: column;
                align-items: center;
            }

            .gov-info {
                grid-template-columns: 1fr;
            }

            .gov-link-box {
                flex-direction: column;
            }

            .btn-copy {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-icon">🔗</div>
            <h1 class="header-title">روابط المحافظات</h1>
            <p class="header-subtitle">انسخ رابط كل محافظة وابعته للمنسق مباشرة</p>
            <div class="session-info">
                🔑 معرّف الجلسة: <span id="sessionIdDisplay">-</span>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-icon">🏛️</span>
                <div>
                    <div class="stat-value" id="totalGov">0</div>
                    <div class="stat-label">محافظة</div>
                </div>
            </div>
            <div class="stat-item">
                <span class="stat-icon">✅</span>
                <div>
                    <div class="stat-value" id="submittedGov">0</div>
                    <div class="stat-label">مكتملة</div>
                </div>
            </div>
            <div class="stat-item">
                <span class="stat-icon">🍽️</span>
                <div>
                    <div class="stat-value" id="totalMeals">0</div>
                    <div class="stat-label">وجبة مستهدفة</div>
                </div>
            </div>
        </div>

        <!-- Gov Cards -->
        <div class="gov-grid" id="govGrid">
            <div class="loading">
                <div class="loading-spinner"></div>
                <div class="loading-text">جاري تحميل المحافظات...</div>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDZvB9jIzd5ponaiudD61PiL8tfajEHx2A",
            authDomain: "life-makers-diagnostic.firebaseapp.com",
            projectId: "life-makers-diagnostic",
            storageBucket: "life-makers-diagnostic.appspot.com",
            messagingSenderId: "137599837774",
            appId: "1:137599837774:web:e5f2f6a5c547c265fc0fba"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Get session ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');

        if (!sessionId) {
            document.getElementById('govGrid').innerHTML = `
                <div class="empty-state" style="grid-column: 1 / -1;">
                    <div class="empty-icon">⚠️</div>
                    <div class="empty-text">لم يتم تحديد الجلسة</div>
                    <div class="empty-subtext">أضف ?session=XXX للرابط</div>
                </div>
            `;
        } else {
            document.getElementById('sessionIdDisplay').textContent = sessionId;
            loadGovernorates();
        }

        // Base URL
        const baseUrl = window.location.origin + window.location.pathname.replace('planning-links.html', '');

        // Load Governorates
        function loadGovernorates() {
            db.collection('eish-wa-malh-governorates')
                .where('sessionId', '==', sessionId)
                .onSnapshot((snapshot) => {
                    const governorates = [];
                    snapshot.forEach((doc) => {
                        governorates.push(doc.data());
                    });
                    
                    renderGovernorates(governorates);
                    updateStats(governorates);
                });
        }

        // Render Governorates
        function renderGovernorates(govList) {
            const container = document.getElementById('govGrid');

            if (govList.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-icon">📭</div>
                        <div class="empty-text">لا توجد محافظات مسجلة بعد</div>
                        <div class="empty-subtext">شارك رابط التخطيط الأساسي مع المحافظات للبدء</div>
                    </div>
                `;
                return;
            }

            // Sort by name
            govList.sort((a, b) => a.governorate.localeCompare(b.governorate, 'ar'));

            container.innerHTML = govList.map(gov => {
                const link = `${baseUrl}planning-participate.html?session=${sessionId}&gov=${encodeURIComponent(gov.governorate)}`;
                const cardId = gov.governorate.replace(/\s/g, '_');
                
                return `
                    <div class="gov-card ${gov.status === 'submitted' ? 'submitted' : ''}">
                        <div class="gov-card-header">
                            <div class="gov-name">
                                <span>🏛️</span>
                                <span>${gov.governorate}</span>
                            </div>
                            <span class="gov-status ${gov.status || 'in-progress'}">
                                ${gov.status === 'submitted' ? '✅ مكتملة' : '⏳ قيد التخطيط'}
                            </span>
                        </div>
                        
                        <div class="gov-info">
                            <div class="gov-info-item">
                                <div class="gov-info-label">👤 المنسق</div>
                                <div class="gov-info-value">${gov.coordinator || '-'}</div>
                            </div>
                            <div class="gov-info-item">
                                <div class="gov-info-label">🍽️ المستهدف</div>
                                <div class="gov-info-value highlight">${(gov.totalTarget || 0).toLocaleString()} وجبة</div>
                            </div>
                        </div>
                        
                        <div class="gov-link-section">
                            <div class="gov-link-label">
                                <span>🔗</span>
                                <span>رابط المحافظة (انسخه وابعته للمنسق)</span>
                            </div>
                            <div class="gov-link-box">
                                <input type="text" class="gov-link-input" id="link_${cardId}" value="${link}" readonly onclick="this.select()">
                                <button class="btn-copy" id="btn_${cardId}" onclick="copyLink('${cardId}', '${gov.governorate}')">
                                    <span>📋</span>
                                    <span>نسخ</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Update Stats
        function updateStats(govList) {
            document.getElementById('totalGov').textContent = govList.length;
            document.getElementById('submittedGov').textContent = govList.filter(g => g.status === 'submitted').length;
            
            const totalMeals = govList.reduce((sum, g) => sum + (g.totalTarget || 0), 0);
            document.getElementById('totalMeals').textContent = totalMeals.toLocaleString();
        }

        // Copy Link
        function copyLink(cardId, govName) {
            const input = document.getElementById('link_' + cardId);
            const btn = document.getElementById('btn_' + cardId);
            
            input.select();
            document.execCommand('copy');
            
            // Update button
            btn.classList.add('copied');
            btn.innerHTML = '<span>✅</span><span>تم النسخ!</span>';
            
            // Show toast
            showToast('✅ تم نسخ رابط ' + govName);
            
            // Reset button after 2 seconds
            setTimeout(() => {
                btn.classList.remove('copied');
                btn.innerHTML = '<span>📋</span><span>نسخ</span>';
            }, 2000);
        }

        // Show Toast
        function showToast(message) {
            // Remove existing toast
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
    </script>
</body>
</html>
