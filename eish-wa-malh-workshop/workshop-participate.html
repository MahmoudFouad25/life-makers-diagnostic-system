<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👤 المشاركة في الورشة</title>
    <link rel="stylesheet" href="workshop-styles.css">
    <style>
        /* تنسيقات واجهة المشارك - محسّنة للموبايل */
        body {
            padding: 0;
            margin: 0;
            min-height: 100vh;
        }

        .participant-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* رأس الصفحة */
        .participant-header {
            background: linear-gradient(135deg, var(--bg-dark-2) 0%, var(--bg-dark-3) 100%);
            border: 2px solid var(--bg-dark-3);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            text-align: center;
        }

        .header-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .header-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .session-info {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid var(--bg-dark-3);
            font-size: 12px;
            color: var(--text-muted);
        }

        /* بطاقة الترحيب */
        .welcome-card {
            background: linear-gradient(135deg, var(--bg-dark-2) 0%, var(--bg-dark-3) 100%);
            border: 2px solid var(--bg-dark-3);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .welcome-icon-large {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .welcome-text {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .name-input-group {
            margin-top: 30px;
        }

        .name-input {
            width: 100%;
            padding: 16px 20px;
            background: var(--bg-dark);
            border: 2px solid var(--bg-dark-3);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 18px;
            text-align: center;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .name-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
        }

        /* بطاقة الانتظار */
        .waiting-card {
            background: linear-gradient(135deg, var(--bg-dark-2) 0%, var(--bg-dark-3) 100%);
            border: 2px solid var(--primary-color);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            animation: pulse 3s ease infinite;
        }

        .waiting-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s ease infinite;
        }

        .waiting-text {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .waiting-subtext {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .connected-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(16, 185, 129, 0.2);
            border: 2px solid var(--success);
            border-radius: 20px;
            margin-top: 20px;
            font-weight: 600;
            color: #6ee7b7;
        }

        .connected-dot {
            width: 10px;
            height: 10px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s ease infinite;
        }

        /* بطاقة السؤال */
        .question-card-mobile {
            background: linear-gradient(135deg, var(--bg-dark-2) 0%, var(--bg-dark-3) 100%);
            border: 2px solid var(--primary-color);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            animation: slideUp 0.5s ease;
        }

        .question-label-mobile {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .question-text-mobile {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .answer-input {
            width: 100%;
            min-height: 150px;
            padding: 18px;
            background: var(--bg-dark);
            border: 2px solid var(--bg-dark-3);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
            resize: vertical;
            font-family: inherit;
        }

        .answer-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
        }

        .char-counter {
            text-align: left;
            margin-top: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* الاستبيان */
        .survey-container {
            margin-bottom: 20px;
        }

        .survey-question {
            background: linear-gradient(135deg, var(--bg-dark-2) 0%, var(--bg-dark-3) 100%);
            border: 2px solid var(--bg-dark-3);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .survey-q-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            border-radius: 50%;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .survey-q-text {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .survey-choices {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .survey-choice {
            padding: 16px 20px;
            background: var(--bg-dark);
            border: 2px solid var(--bg-dark-3);
            border-radius: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .survey-choice:hover {
            background: var(--bg-dark-2);
            border-color: var(--primary-color);
        }

        .survey-choice.selected {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
            border-color: var(--primary-color);
            color: var(--text-primary);
        }

        .choice-radio {
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-muted);
            border-radius: 50%;
            position: relative;
        }

        .survey-choice.selected .choice-radio {
            border-color: var(--primary-color);
        }

        .survey-choice.selected .choice-radio::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: var(--primary-color);
            border-radius: 50%;
        }

        /* نتيجة الاستبيان */
        .result-card {
            background: linear-gradient(135deg, var(--bg-dark-2) 0%, var(--bg-dark-3) 100%);
            border: 3px solid var(--primary-color);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            animation: slideUp 0.5s ease;
        }

        .result-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .result-score {
            font-size: 48px;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .result-category {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .result-description {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .result-badge {
            display: inline-block;
            padding: 12px 24px;
            background: rgba(102, 126, 234, 0.2);
            border: 2px solid var(--primary-color);
            border-radius: 20px;
            font-weight: 700;
            color: var(--text-primary);
            font-size: 18px;
        }

        /* Toast */
        .toast-mobile {
            position: fixed;
            top: 20px;
            right: 20px;
            left: 20px;
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            color: white;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.4);
            z-index: 10000;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideInDown 0.3s ease;
        }

        .toast-mobile.error {
            background: linear-gradient(135deg, var(--error) 0%, #dc2626 100%);
        }

        /* حالة التحميل */
        .loading-inline {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .spinner-small {
            width: 40px;
            height: 40px;
            border: 4px solid var(--bg-dark-3);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @media (max-width: 480px) {
            .participant-container {
                padding: 15px;
            }
            .question-text-mobile {
                font-size: 20px;
            }
            .result-category {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="participant-container">
        <!-- رأس الصفحة -->
        <div class="participant-header">
            <div class="header-icon">🎯</div>
            <div class="header-title">من التنفيذ للتبني</div>
            <div class="header-subtitle">مشروع عيش وملح - صناع الحياة</div>
            <div class="session-info">
                الجلسة: <span id="sessionIdDisplay">...</span>
            </div>
        </div>

        <!-- شاشة الترحيب -->
        <div id="welcomeSection">
            <div class="welcome-card">
                <div class="welcome-icon-large">👋</div>
                <div class="welcome-text">
                    مرحباً بك في ورشة "من التنفيذ للتبني"!
                </div>
                <div class="name-input-group">
                    <label class="input-label" style="text-align: center; display: block; margin-bottom: 10px;">
                        من فضلك أدخل اسمك:
                    </label>
                    <input 
                        type="text" 
                        id="participantNameInput" 
                        class="name-input"
                        placeholder="مثال: أحمد محمد"
                    >
                    <button class="submit-btn" id="joinBtn">
                        ✅ انضم للورشة
                    </button>
                </div>
            </div>
        </div>

        <!-- شاشة الانتظار -->
        <div id="waitingSection" class="hidden">
            <div class="waiting-card">
                <div class="waiting-icon">⏳</div>
                <div class="waiting-text">أهلاً <span id="welcomeNameDisplay"></span>!</div>
                <div class="waiting-subtext">
                    أنت الآن متصل بالورشة.<br>
                    انتظر تعليمات الميسّر لبدء التفاعل.
                </div>
                <div class="connected-badge">
                    <div class="connected-dot"></div>
                    <span>متصل</span>
                </div>
            </div>
        </div>

        <!-- شاشة السؤال الافتتاحي -->
        <div id="questionSection" class="hidden">
            <div class="question-card-mobile">
                <div class="question-label-mobile">السؤال الافتتاحي</div>
                <div class="question-text-mobile" id="questionTextMobile">
                    صناع الحياة موجودة ليه؟
                </div>
                <textarea 
                    id="answerTextarea" 
                    class="answer-input"
                    placeholder="اكتب إجابتك هنا..."
                ></textarea>
                <div class="char-counter">
                    <span id="charCount">0</span> حرف
                </div>
            </div>
            <button class="submit-btn" id="submitAnswerBtn">
                📤 إرسال الإجابة
            </button>
        </div>

        <!-- شاشة الاستبيان -->
        <div id="surveySection" class="hidden">
            <h2 style="color: var(--text-primary); font-size: 22px; font-weight: 700; margin-bottom: 20px; text-align: center;">
                📝 استبيان "مين أنت فعلاً؟"
            </h2>
            <div class="survey-container" id="surveyQuestionsContainer">
                <!-- الأسئلة ستُولَّد هنا -->
            </div>
            <button class="submit-btn" id="submitSurveyBtn" disabled>
                ✅ إرسال الاستبيان
            </button>
        </div>

        <!-- شاشة النتيجة -->
        <div id="resultSection" class="hidden">
            <div class="result-card">
                <div class="result-icon" id="resultIcon">🎯</div>
                <div class="result-score" id="resultScore">0/15</div>
                <div class="result-category" id="resultCategory">...</div>
                <div class="result-description" id="resultDescription">...</div>
                <div class="result-badge" id="resultBadge">...</div>
            </div>
        </div>

        <!-- شاشة التحميل -->
        <div id="loadingSection" class="hidden">
            <div class="loading-inline">
                <div class="spinner-small"></div>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, doc, getDoc, updateDoc, arrayUnion, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDZvB9jIzd5ponaiudD61PiL8tfajEHx2A",
            authDomain: "life-makers-diagnostic.firebaseapp.com",
            projectId: "life-makers-diagnostic",
            storageBucket: "life-makers-diagnostic.firebasestorage.app",
            messagingSenderId: "819336926740",
            appId: "1:819336926740:web:d338b3299e6d18e3b67901",
            measurementId: "G-4Z1FWWKG1C"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Get Session ID
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');

        if (!sessionId) {
            alert('⚠️ لم يتم تحديد معرّف الجلسة');
        }

        document.getElementById('sessionIdDisplay').textContent = sessionId;

        let participantName = '';
        let participantId = generateParticipantId();
        let workshopData = null;
        let surveyAnswers = {};

        function generateParticipantId() {
            return 'P-' + Date.now() + '-' + Math.random().toString(36).substring(2, 7);
        }

        // Join Workshop
        document.getElementById('joinBtn').onclick = async () => {
            const name = document.getElementById('participantNameInput').value.trim();
            
            if (!name) {
                showToast('error', '⚠️ من فضلك أدخل اسمك');
                return;
            }

            participantName = name;

            try {
                const workshopRef = doc(db, 'workshops', sessionId);
                await updateDoc(workshopRef, {
                    participants: arrayUnion({
                        id: participantId,
                        name: participantName,
                        joinedAt: new Date()
                    })
                });

                document.getElementById('welcomeNameDisplay').textContent = participantName;
                showSection('waitingSection');
                showToast('success', '✅ تم الانضمام بنجاح!');

            } catch (error) {
                console.error('Error joining:', error);
                showToast('error', '❌ حدث خطأ: ' + error.message);
            }
        };

        // Listen to Workshop Changes
        const workshopRef = doc(db, 'workshops', sessionId);
        onSnapshot(workshopRef, (docSnap) => {
            if (docSnap.exists()) {
                workshopData = docSnap.data();
                handleWorkshopUpdate();
            }
        });

        function handleWorkshopUpdate() {
            if (!workshopData) return;

            // Check if question is active
            if (workshopData.openingQuestion?.active && workshopData.openingQuestion?.acceptingResponses) {
                showSection('questionSection');
            }
            // Check if survey is active
            else if (workshopData.surveyActive) {
                showSection('surveySection');
                renderSurvey();
            }
        }

        // Submit Answer
        document.getElementById('submitAnswerBtn').onclick = async () => {
            const answer = document.getElementById('answerTextarea').value.trim();
            
            if (!answer) {
                showToast('error', '⚠️ من فضلك اكتب إجابتك');
                return;
            }

            try {
                await updateDoc(workshopRef, {
                    'responses.openingQuestion': arrayUnion({
                        participantId: participantId,
                        participantName: participantName,
                        answer: answer,
                        timestamp: new Date()
                    })
                });

                showToast('success', '✅ تم إرسال إجابتك!');
                document.getElementById('answerTextarea').value = '';
                document.getElementById('submitAnswerBtn').disabled = true;
                
                setTimeout(() => {
                    showSection('waitingSection');
                }, 1500);

            } catch (error) {
                showToast('error', '❌ حدث خطأ: ' + error.message);
            }
        };

        // Character Counter
        document.getElementById('answerTextarea').oninput = function() {
            document.getElementById('charCount').textContent = this.value.length;
        };

        // Survey Questions
        const surveyQuestions = [
            {
                id: 'q1',
                text: 'لما بتواجه مشكلة في المشروع:',
                choices: [
                    { value: 1, text: '(أ) بستنى حد يحلها أو يقولي أعمل إيه' },
                    { value: 2, text: '(ب) بحاول أحلها بنفسي وأبلغ بعدين' },
                    { value: 3, text: '(ج) بحلها وبفكر إزاي نمنع تكرارها في المستقبل' }
                ]
            },
            {
                id: 'q2',
                text: 'لما بشوف فرصة للمشروع (شراكة جديدة، متطوع محتمل، فكرة):',
                choices: [
                    { value: 1, text: '(أ) بقول لحد من القيادة وأستنى يتصرف' },
                    { value: 2, text: '(ب) باخد خطوة لو جوا صلاحياتي' },
                    { value: 3, text: '(ج) باخد خطوة حتى لو برا صلاحياتي وأبلغ بعدين' }
                ]
            },
            {
                id: 'q3',
                text: 'لما الحماس بيقل عندي أو عند الفريق:',
                choices: [
                    { value: 1, text: '(أ) بستنى حدث أو حد يرجّع الحماس' },
                    { value: 2, text: '(ب) بفتكر ليه بدأت وبحاول أكمل' },
                    { value: 3, text: '(ج) بحمّس نفسي وكمان بحمّس اللي حواليا' }
                ]
            },
            {
                id: 'q4',
                text: 'لما المستهدف يبان صعب أو مستحيل:',
                choices: [
                    { value: 1, text: '(أ) بقول صعب ومش هينفع وبستنى يتعدل' },
                    { value: 2, text: '(ب) بحاول أوصل لأقرب رقم ممكن' },
                    { value: 3, text: '(ج) بفكر في طرق جديدة محدش جربها لتحقيقه' }
                ]
            },
            {
                id: 'q5',
                text: 'بعد ما المشروع أو الحملة تخلص:',
                choices: [
                    { value: 1, text: '(أ) خلاص، المهمة انتهت، بستنى المهمة الجاية' },
                    { value: 2, text: '(ب) بعمل تقييم سريع لنفسي' },
                    { value: 3, text: '(ج) بفكر إزاي نطوّر للسنة الجاية وبشارك أفكاري' }
                ]
            }
        ];

        function renderSurvey() {
            const container = document.getElementById('surveyQuestionsContainer');
            container.innerHTML = '';

            surveyQuestions.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'survey-question';
                
                let choicesHTML = '';
                q.choices.forEach(choice => {
                    choicesHTML += `
                        <div class="survey-choice" data-question="${q.id}" data-value="${choice.value}">
                            <div class="choice-radio"></div>
                            <span>${choice.text}</span>
                        </div>
                    `;
                });

                questionDiv.innerHTML = `
                    <div class="survey-q-number">${index + 1}</div>
                    <div class="survey-q-text">${q.text}</div>
                    <div class="survey-choices">
                        ${choicesHTML}
                    </div>
                `;

                container.appendChild(questionDiv);
            });

            // Add click handlers
            document.querySelectorAll('.survey-choice').forEach(choice => {
                choice.onclick = function() {
                    const questionId = this.dataset.question;
                    const value = parseInt(this.dataset.value);

                    // Deselect other choices for this question
                    document.querySelectorAll(`[data-question="${questionId}"]`).forEach(c => {
                        c.classList.remove('selected');
                    });

                    // Select this choice
                    this.classList.add('selected');
                    surveyAnswers[questionId] = value;

                    // Enable submit if all answered
                    if (Object.keys(surveyAnswers).length === surveyQuestions.length) {
                        document.getElementById('submitSurveyBtn').disabled = false;
                    }
                };
            });
        }

        // Submit Survey
        document.getElementById('submitSurveyBtn').onclick = async () => {
            const totalScore = Object.values(surveyAnswers).reduce((sum, val) => sum + val, 0);
            
            try {
                await updateDoc(workshopRef, {
                    'responses.survey': arrayUnion({
                        participantId: participantId,
                        participantName: participantName,
                        answers: surveyAnswers,
                        totalScore: totalScore,
                        timestamp: new Date()
                    })
                });

                showResult(totalScore);
                showToast('success', '✅ تم إرسال الاستبيان!');

            } catch (error) {
                showToast('error', '❌ حدث خطأ: ' + error.message);
            }
        };

        function showResult(score) {
            let category, description, badge, icon;

            if (score >= 5 && score <= 8) {
                category = 'mode التنفيذ';
                description = 'أنت حالياً في وضع التنفيذ. تقوم بالمهام المطلوبة بشكل جيد، لكن هناك فرصة للتطور نحو التبني.';
                badge = '⚡ منفذ';
                icon = '⚡';
            } else if (score >= 9 && score <= 12) {
                category = 'في المنتصف';
                description = 'أنت في مرحلة انتقالية بين التنفيذ والتبني. لديك بعض سمات المتبني لكن لا زال هناك مجال للنمو.';
                badge = '🔄 في الطريق';
                icon = '🔄';
            } else {
                category = 'mode التبني';
                description = 'مبروك! أنت متبني حقيقي. تأخذ ملكية المشروع وتفكر في التطوير المستمر.';
                badge = '🎯 متبني';
                icon = '🎯';
            }

            document.getElementById('resultIcon').textContent = icon;
            document.getElementById('resultScore').textContent = `${score}/15`;
            document.getElementById('resultCategory').textContent = category;
            document.getElementById('resultDescription').textContent = description;
            document.getElementById('resultBadge').textContent = badge;

            showSection('resultSection');
        }

        function showSection(sectionId) {
            const sections = ['welcomeSection', 'waitingSection', 'questionSection', 'surveySection', 'resultSection', 'loadingSection'];
            sections.forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(sectionId).classList.remove('hidden');
        }

        function showToast(type, message) {
            const toast = document.createElement('div');
            toast.className = `toast-mobile ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        console.log('Participant Interface loaded for session:', sessionId);
    </script>
</body>
</html>
